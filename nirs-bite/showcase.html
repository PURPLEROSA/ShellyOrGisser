<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07030f">
<meta name="description" content="NIR'S BITE — 119 המקומות של ניר, מאנהיים לניו יורק. אוגוסט 2026.">
<title>NIR'S BITE — THE PLACES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700&family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07030f;
  --ink2:#0e0620;
  --paper:#f4f1ea;
  --acc:#ff2d95;          /* set per city at runtime */
  --acc2:#00e5ff;
  --grain:.05;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:#fff;overflow:hidden}
body{font-family:'Barlow Condensed',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.he{font-family:'Heebo',system-ui,sans-serif;direction:rtl;unicode-bidi:plaintext;text-align:start}

#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}

/* ===================== film grain + frame ===================== */
#grain{
  position:fixed;inset:-60%;z-index:60;pointer-events:none;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  animation:gr .9s steps(3) infinite;
}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-2%,1.5%)}66%{transform:translate(1.5%,-2%)}100%{transform:translate(0,0)}}
#vig{position:fixed;inset:0;z-index:55;pointer-events:none;
  background:radial-gradient(120% 88% at 50% 44%, rgba(0,0,0,0) 40%, rgba(0,0,0,.72) 100%)}

/* ===================== CINEMA ===================== */
#cinema{position:absolute;inset:0;z-index:10}
.card{position:absolute;inset:0;opacity:0;pointer-events:none}
.card.live{opacity:1;pointer-events:auto}

/* the photo plate — duotone, slow push */
.plate{position:absolute;inset:0;overflow:hidden;background:var(--ink2)}
.plate .img{
  position:absolute;inset:-6%;background-size:cover;background-position:center;
  filter:grayscale(1) contrast(1.28) brightness(.62);
  transform:scale(1.04);
}
.card.live .plate .img{animation:push 14s ease-out forwards}
@keyframes push{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.19) translate(-1.6%,-1.2%)}}
.plate .tone{position:absolute;inset:0;background:var(--acc);mix-blend-mode:color;opacity:.85}
.plate .lift{position:absolute;inset:0;
  background:linear-gradient(120deg, rgba(0,229,255,.22), rgba(0,0,0,0) 55%);mix-blend-mode:screen}
.plate .sink{position:absolute;inset:0;
  background:linear-gradient(15deg, rgba(4,1,10,.96) 4%, rgba(4,1,10,.55) 38%, rgba(4,1,10,.10) 66%, rgba(4,1,10,.45) 100%)}

/* the designed fallback when no photograph exists — still a poster */
.plate.blank{
  background:
    repeating-linear-gradient(var(--rot,135deg), rgba(255,255,255,.045) 0 2px, rgba(0,0,0,0) 2px 24px),
    radial-gradient(78% 62% at 74% 16%, color-mix(in srgb, var(--acc) 62%, #000), rgba(0,0,0,0) 60%),
    radial-gradient(60% 50% at 12% 92%, color-mix(in srgb, var(--acc2) 26%, #000), rgba(0,0,0,0) 58%),
    linear-gradient(160deg, var(--ink2), #05020c 70%);
}

/* ===================== type block ===================== */
.tblock{
  position:absolute;left:clamp(20px,5vw,84px);bottom:clamp(152px,19vh,208px);
  right:clamp(20px,5vw,84px);z-index:4;
  display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);
  gap:clamp(22px,4vw,64px);align-items:end;
}
.tblock .col{min-width:0}
.tblock .col.r{padding-bottom:6px}
.rule{height:5px;width:78px;background:var(--acc);box-shadow:0 0 22px var(--acc);margin-bottom:16px;
  transform-origin:left;}
.kicker{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;
  font-size:clamp(11px,1.25vw,14px);letter-spacing:.34em;text-transform:uppercase;font-weight:600;
}
.kicker .city{color:var(--acc);text-shadow:0 0 18px color-mix(in srgb, var(--acc) 60%, transparent)}
.kicker .dot{opacity:.4}
.kicker .when{color:#cfd6e6}
.name{
  font-family:'Anton','Arial Narrow',Impact,sans-serif;text-transform:uppercase;
  line-height:.88;letter-spacing:-.012em;overflow-wrap:break-word;
  color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.75), 0 2px 0 rgba(0,0,0,.5);
  font-size:clamp(30px,5.6vw,92px);
}
.name.s1{font-size:clamp(38px,7.2vw,116px)}
.name.s2{font-size:clamp(32px,5.4vw,88px)}
.name.s3{font-size:clamp(26px,4.1vw,62px)}
.name.s4{font-size:clamp(22px,3.1vw,46px);line-height:.98}
.name em{font-style:normal;color:var(--acc);
  text-shadow:0 0 40px color-mix(in srgb, var(--acc) 70%, transparent), 0 2px 0 rgba(0,0,0,.5)}
.name.s4 em,.name.s3 em{text-shadow:0 0 26px color-mix(in srgb, var(--acc) 60%, transparent)}
.addr{margin-top:12px;font-size:clamp(13px,1.6vw,19px);letter-spacing:.16em;color:#a9b2c6;text-transform:uppercase}

.says{font-size:10.5px;letter-spacing:.42em;font-weight:700;color:var(--acc);
  text-transform:uppercase;margin-bottom:9px}
.quote{
  max-width:none;
  font-family:'Heebo',sans-serif;direction:rtl;unicode-bidi:plaintext;text-align:start;
  font-size:clamp(14px,1.65vw,21px);line-height:1.62;color:#e8ecf6;font-weight:400;
}
.quote b{color:#fff;font-weight:700}
.dish{
  display:block;width:fit-content;max-width:100%;margin-inline-start:auto;
  margin-top:clamp(12px,2vh,18px);padding:11px 16px;
  border-right:4px solid var(--acc);background:rgba(0,0,0,.46);
  font-family:'Heebo',sans-serif;direction:rtl;unicode-bidi:plaintext;text-align:start;
  font-size:clamp(13px,1.5vw,19px);line-height:1.5;color:#ffe6b0;font-weight:700;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}

/* staggered entrance */
.card.live .rule  {animation:wipe .62s cubic-bezier(.16,1,.3,1) both}
.card.live .kicker{animation:rise .62s cubic-bezier(.16,1,.3,1) .06s both}
.card.live .name  {animation:rise .72s cubic-bezier(.16,1,.3,1) .12s both}
.card.live .addr  {animation:rise .62s cubic-bezier(.16,1,.3,1) .20s both}
.card.live .says  {animation:rise .62s cubic-bezier(.16,1,.3,1) .24s both}
.card.live .quote {animation:rise .62s cubic-bezier(.16,1,.3,1) .28s both}
.card.live .dish  {animation:rise .62s cubic-bezier(.16,1,.3,1) .36s both}
.card.live .idx   {animation:fadeIn .9s ease .18s both}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:.14}}

/* the index number, big and quiet */
.idx{
  position:absolute;right:clamp(16px,3.4vw,54px);top:clamp(74px,11vh,120px);z-index:3;opacity:.14;
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(90px,20vw,300px);line-height:.72;
  color:#fff;letter-spacing:-.05em;pointer-events:none;
}

/* ===================== chapter card (a city opens) ===================== */
#chapter{
  position:absolute;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:6px;
  background:
    radial-gradient(85% 60% at 50% 45%, color-mix(in srgb, var(--acc) 26%, transparent), rgba(0,0,0,0) 68%),
    linear-gradient(160deg,#0d0620,#04010b);
}
#chapter.on{display:flex;animation:chIn .5s ease both}
@keyframes chIn{from{opacity:0}to{opacity:1}}
#chapter .num{font-size:clamp(11px,1.4vw,15px);letter-spacing:.55em;color:var(--acc);font-weight:700;margin-bottom:14px}
#chapter .big{
  font-family:'Anton','Arial Narrow',Impact,sans-serif;text-transform:uppercase;
  font-size:clamp(46px,12vw,190px);line-height:.82;letter-spacing:-.02em;text-align:center;
  background:linear-gradient(180deg,#fff 0%,#e7eefb 26%,#93a7c6 48%,#fff 54%,var(--acc) 78%, color-mix(in srgb, var(--acc) 40%, #000) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 14px 40px rgba(0,0,0,.7));
  animation:chBig .8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes chBig{from{opacity:0;transform:translateY(34px) scale(.97)}to{opacity:1;transform:none}}
#chapter .sub{margin-top:16px;font-size:clamp(12px,1.5vw,17px);letter-spacing:.34em;color:#b9c2d6;text-transform:uppercase;
  animation:rise .7s cubic-bezier(.16,1,.3,1) .18s both}
#chapter .bar{margin-top:26px;height:4px;width:min(52vw,420px);background:rgba(255,255,255,.12);overflow:hidden}
#chapter .bar i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;
  animation:wipe 2.6s linear both}

/* ===================== HUD ===================== */
#hud{position:absolute;inset:0;z-index:30;pointer-events:none}
#hud button,#hud a{pointer-events:auto}

#brand{
  position:absolute;left:clamp(16px,3vw,40px);top:clamp(14px,2.4vh,28px);
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(17px,2.1vw,26px);letter-spacing:.04em;
  line-height:1;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.7);
}
#brand small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.42em;color:var(--acc);margin-top:5px;font-weight:600}

#track{
  position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.10);
}
#track i{display:block;height:100%;background:var(--acc);box-shadow:0 0 14px var(--acc);width:0;
  transition:width .4s linear}

#counter{
  position:absolute;right:clamp(16px,3vw,40px);top:clamp(14px,2.4vh,28px);text-align:right;
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(15px,1.9vw,22px);color:#fff;line-height:1;
}
#counter small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:10.5px;
  letter-spacing:.4em;color:#8e97ab;margin-top:5px;font-weight:600}

#deck{
  position:absolute;left:50%;bottom:clamp(16px,2.6vh,30px);transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:8px;
  background:rgba(8,3,18,.72);border:1px solid rgba(255,255,255,.14);border-radius:999px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
}
#deck button{
  cursor:pointer;border:none;background:transparent;color:#dfe5f2;
  width:42px;height:42px;border-radius:999px;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s;
}
#deck button:hover{background:rgba(255,255,255,.12);color:#fff}
#deck button.play{
  width:52px;height:52px;background:var(--acc);color:#0a0210;font-size:19px;
  box-shadow:0 0 26px color-mix(in srgb, var(--acc) 65%, transparent);
}
#deck button.play:hover{filter:brightness(1.12);background:var(--acc)}
#deck .lbl{
  padding:0 14px 0 8px;font-size:12px;letter-spacing:.24em;color:#98a1b6;text-transform:uppercase;
  white-space:nowrap;font-weight:600;
}

/* the day rail */
#rail{
  position:absolute;left:0;right:0;bottom:clamp(74px,10vh,92px);z-index:29;
  display:flex;gap:6px;padding:0 clamp(16px,3vw,40px);overflow-x:auto;scrollbar-width:none;
  pointer-events:auto;-webkit-overflow-scrolling:touch;
}
#rail::-webkit-scrollbar{display:none}
#rail button{
  flex:0 0 auto;cursor:pointer;border:1px solid rgba(255,255,255,.14);background:rgba(8,3,18,.6);
  color:#aab3c6;border-radius:999px;padding:6px 13px;font-size:11.5px;letter-spacing:.16em;
  font-weight:600;text-transform:uppercase;backdrop-filter:blur(10px);white-space:nowrap;
  transition:background .18s,color .18s,border-color .18s;
}
#rail button:hover{color:#fff;border-color:rgba(255,255,255,.34)}
#rail button.on{background:var(--acc);color:#0a0210;border-color:transparent;
  box-shadow:0 0 20px color-mix(in srgb, var(--acc) 55%, transparent)}

/* ===================== WALL — every place at once ===================== */
#wall{
  position:absolute;inset:0;z-index:40;display:none;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(180deg,#0a0418,#05020c);
}
#wall.on{display:block;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#wall .wtop{
  position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:clamp(16px,3vh,26px) clamp(16px,3vw,40px);
  background:linear-gradient(180deg,rgba(8,3,18,.97),rgba(8,3,18,.86));
  border-bottom:1px solid rgba(255,255,255,.10);backdrop-filter:blur(16px);
}
#wall .wtop h2{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(20px,3vw,34px);letter-spacing:.02em}
#wall .wtop h2 span{color:var(--acc)}
#wall .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
#wall .filters button{
  cursor:pointer;border:1px solid rgba(255,255,255,.16);background:transparent;color:#aab3c6;
  border-radius:999px;padding:7px 15px;font-size:11.5px;letter-spacing:.2em;font-weight:600;
  text-transform:uppercase;transition:.18s;
}
#wall .filters button:hover{color:#fff;border-color:rgba(255,255,255,.4)}
#wall .filters button.on{background:#fff;color:#0a0210;border-color:#fff}
#wall .close{
  cursor:pointer;border:none;background:var(--acc);color:#0a0210;border-radius:999px;
  width:40px;height:40px;font-size:17px;
}
#grid{
  display:grid;gap:clamp(10px,1.4vw,18px);padding:clamp(16px,3vw,40px);
  grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
}
.tile{
  position:relative;aspect-ratio:4/5;overflow:hidden;cursor:pointer;background:var(--ink2);
  border:1px solid rgba(255,255,255,.09);
  transition:transform .3s cubic-bezier(.16,1,.3,1), border-color .3s;
}
.tile:hover{transform:translateY(-5px);border-color:color-mix(in srgb, var(--tc) 70%, transparent)}
.tile .ti{position:absolute;inset:0;background-size:cover;background-position:center;
  filter:grayscale(1) contrast(1.25) brightness(.6);transition:transform .6s cubic-bezier(.16,1,.3,1)}
.tile:hover .ti{transform:scale(1.07)}
.tile .tt{position:absolute;inset:0;background:var(--tc);mix-blend-mode:color;opacity:.85}
.tile .tg{position:absolute;inset:0;
  background:linear-gradient(0deg, rgba(3,1,8,.96) 6%, rgba(3,1,8,.35) 46%, rgba(3,1,8,.06) 100%)}
.tile.blank .ti{
  background:
    repeating-linear-gradient(var(--rot,135deg), rgba(255,255,255,.055) 0 2px, rgba(0,0,0,0) 2px 20px),
    radial-gradient(82% 58% at var(--gx,76%) var(--gy,20%), color-mix(in srgb, var(--tc) 58%, #000), rgba(0,0,0,0) 62%),
    linear-gradient(160deg,#12082a,#05020c);
  filter:none;
}
.tile.blank .no{font-size:64px;color:color-mix(in srgb, var(--tc) 34%, transparent)}
.tile.blank .tt{display:none}
.tile .no{position:absolute;right:10px;top:6px;font-family:'Anton','Arial Narrow',Impact,sans-serif;
  font-size:52px;line-height:1;color:rgba(255,255,255,.16)}
.tile .body{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 16px;z-index:2}
.tile .cty{font-size:10px;letter-spacing:.34em;font-weight:700;color:var(--tc);text-transform:uppercase}
.tile h3{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:19px;line-height:1.02;margin:6px 0 5px;
  text-transform:uppercase;color:#fff}
.tile .meta{font-size:11.5px;letter-spacing:.14em;color:#98a1b6;text-transform:uppercase}
.tile .eat{margin-top:8px;font-family:'Heebo',sans-serif;direction:rtl;unicode-bidi:plaintext;
  text-align:start;font-size:12px;line-height:1.5;color:#ffd9a0;font-weight:700;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .bar{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--tc);opacity:.9;z-index:3}

/* ===================== INTRO ===================== */
#intro{
  position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;cursor:pointer;
  background:radial-gradient(80% 55% at 50% 42%, #1a0a33, #05020c 70%);
}
#intro.gone{display:none}
#intro .logo{
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(48px,13.5vw,190px);line-height:.82;
  letter-spacing:-.02em;text-align:center;
  background:linear-gradient(180deg,#fff 0%,#eaf1ff 22%,#8fa6c6 46%,#fff 53%,#ffd400 74%,#ff7a18 92%,#a82f08 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(4px 5px 0 #ff2d95) drop-shadow(-3px -3px 0 #00e5ff) drop-shadow(0 20px 60px rgba(255,45,149,.4));
  animation:chBig 1s cubic-bezier(.16,1,.3,1) both;
}
#intro .tag{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(13px,2.6vw,26px);letter-spacing:.42em;
  color:#00e5ff;text-shadow:0 0 26px rgba(0,229,255,.6);animation:rise .8s ease .22s both}
#intro .sub{font-family:'Heebo',sans-serif;direction:rtl;color:#b6bfd4;font-size:clamp(13px,1.6vw,17px);
  line-height:1.8;text-align:center;max-width:min(88vw,640px);margin-top:16px;animation:rise .8s ease .34s both}
#intro .cta{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:rise .8s ease .46s both}
#intro .cta button{
  cursor:pointer;border:none;border-radius:999px;padding:15px 30px;
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:17px;letter-spacing:.06em;
  background:#ff2d95;color:#0a0210;box-shadow:0 0 34px rgba(255,45,149,.5);transition:.2s;
}
#intro .cta button.ghost{background:transparent;color:#dfe5f2;border:1px solid rgba(255,255,255,.28);box-shadow:none}
#intro .cta button:hover{filter:brightness(1.14);transform:translateY(-2px)}
#intro .grid3{position:absolute;left:-20%;right:-20%;bottom:0;height:38%;pointer-events:none;
  background:
    repeating-linear-gradient(90deg, rgba(255,45,149,.26) 0 2px, rgba(0,0,0,0) 2px 74px),
    repeating-linear-gradient(0deg,  rgba(0,229,255,.22) 0 2px, rgba(0,0,0,0) 2px 50px);
  transform:perspective(340px) rotateX(69deg);transform-origin:50% 100%;
  mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 62%);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 62%);
}

/* ===================== phones ===================== */
@media (max-width:760px){
  .tblock{left:18px;right:18px;bottom:132px;grid-template-columns:1fr;gap:14px;align-items:start}
  .tblock .col.r{padding-bottom:0}
  .says{font-size:9.5px;letter-spacing:.34em;margin-bottom:6px}
  .name{font-size:clamp(28px,9.6vw,54px)}
  .quote{font-size:13.5px;max-width:none;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .dish{font-size:12.5px;max-width:none}
  .idx{font-size:96px;top:64px;right:12px}
  #rail{bottom:88px}
  #deck{gap:4px;padding:6px}
  #deck button{width:38px;height:38px}
  #deck button.play{width:46px;height:46px}
  #deck .lbl{display:none}
  #grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;padding:14px}
  .tile h3{font-size:15px}
  .tile .no{font-size:36px}
  .tile .eat{-webkit-line-clamp:2;font-size:11px}
  #wall .filters{margin-left:0;width:100%}
  #brand small{letter-spacing:.3em}
}
@media (max-width:760px) and (orientation:landscape){
  .tblock{bottom:96px}
  .quote{display:none}
}
</style>
</head>
<body>
<div id="app">

  <div id="cinema"></div>

  <div id="chapter">
    <div class="num" id="chNum">CHAPTER</div>
    <div class="big" id="chBig">CITY</div>
    <div class="sub" id="chSub">—</div>
    <div class="bar"><i></i></div>
  </div>

  <div id="hud">

function photoFor(st){
  var key = st.lat.toFixed(4) + ',' + st.lng.toFixed(4);
  if(photoCache[key] !== undefined) return Promise.resolve(photoCache[key]);
  var url = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*' +
            '&generator=geosearch&ggscoord=' + st.lat + '%7C' + st.lng +
            '&ggsradius=700&ggslimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=1400';
  return fetch(url).then(function(r){ return r.json(); }).then(function(j){
    var pages = (j.query && j.query.pages) ? j.query.pages : {};
    var best = null;
    Object.keys(pages).forEach(function(k){
      var p = pages[k];
      if(p.thumbnail && p.thumbnail.source){
        if(!best || (p.index||99) < (best.index||99)) best = p;
      }
    });
    var u = best ? best.thumbnail.source : null;
    photoCache[key] = u;
    return u;
  }).catch(function(){ photoCache[key] = null; return null; });
}

  var plate = q('.plate'), img = q('.img');
  plate.classList.add('blank');
  plate.style.setProperty('--rot', ((i * 37) % 360) + 'deg');
  img.style.backgroundImage = 'none';

  photoFor(st).then(function(u){
    if(!u) return;
    if(REEL[S.i] !== r) return;                  /* we already moved on */
    var pre = new Image();
    pre.onload = function(){
      if(REEL[S.i] !== r) return;
      img.style.backgroundImage = 'url("' + u + '")';
      plate.classList.remove('blank');
    };
    pre.src = u;
  });

  layers[live].classList.remove('live');
  next.classList.add('live');
  live = 1 - live;

  $('cNow').textContent = i + 1;
  $('cCity').textContent = c.full;
  $('trackFill').style.width = ((i+1) / N * 100) + '%';
  markRail(r.di);

  /* keep the next two warm */
  if(REEL[i+1]) photoFor(REEL[i+1].st);
  if(REEL[i+2]) photoFor(REEL[i+2].st);
}

/* ---------- chapter cards between cities ---------- */
function chapterFor(code, then){
  var c = CITY[code] || CITY.NYC;
  var stops = REEL.filter(function(r){ return r.city === code; }).length;
  var days  = TRIP.days.filter(function(d){ return d.code === code; });
  var span  = days.length ? (days[0].d + ' – ' + days[days.length-1].d) : '';
  document.documentElement.style.setProperty('--acc', c.acc);
  $('chNum').textContent = 'CHAPTER ' + (CITY_ORDER.indexOf(code)+1) + ' OF ' + CITY_ORDER.length;
  $('chBig').textContent = c.name;
  $('chSub').textContent = span + '  ·  ' + stops + ' PLACES';
  var el = $('chapter');
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(S.chapTimer);
  S.chapTimer = setTimeout(function(){ el.classList.remove('on'); then(); }, CHAPTER);
}

function go(i, opts){
  opts = opts || {};
  if(i < 0) i = N - 1;
  if(i >= N) i = 0;
  S.i = i;
  clearTimeout(S.timer);
  var city = REEL[i].city;
  var needChapter = !opts.silent && city !== S.lastCity;
  S.lastCity = city;
  function after(){
    paint(i);
    if(S.playing) S.timer = setTimeout(function(){ go(S.i + 1); }, DWELL);
  }
  if(needChapter) chapterFor(city, after);
  else { $('chapter').classList.remove('on'); after(); }
}

function play(on){
  S.playing = on;
  $('bPlay').textContent = on ? '❚❚' : '▶';
  $('bPlay').title = on ? 'עצור' : 'נגן';
  $('deckLbl').textContent = on ? 'AUTOPLAY' : 'PAUSED';
  clearTimeout(S.timer);
  if(on) S.timer = setTimeout(function(){ go(S.i + 1); }, DWELL);
}

/* ---------- the day rail ---------- */
function buildRail(){
  var h = '';
  TRIP.days.forEach(function(d, di){
    h += '<button data-day="' + di + '">' + esc(d.d) + ' · ' + esc(d.code) + '</button>';
  });
  $('rail').innerHTML = h;
  Array.prototype.forEach.call($('rail').querySelectorAll('button'), function(b){
    b.onclick = function(){
      var di = +b.dataset.day, k;
      for(k = 0; k < N; k++) if(REEL[k].di === di){ go(k); break; }
    };
  });
}
function markRail(di){
  var rail = $('rail');
  Array.prototype.forEach.call(rail.querySelectorAll('button'), function(b){
    var on = +b.dataset.day === di;
    b.classList.toggle('on', on);
    if(on) rail.scrollLeft = b.offsetLeft - (rail.clientWidth - b.offsetWidth)/2;
  });
}

/* ---------- the wall ---------- */
var wallBuilt = false, io = null;
function buildWall(){
  if(wallBuilt) return;
  wallBuilt = true;
  var h = '';
  REEL.forEach(function(r, i){
    var c = CITY[r.city] || CITY.NYC;
    h += '<div class="tile blank" data-i="' + i + '" data-city="' + r.city + '" ' +
         'style="--tc:' + c.acc + ';--rot:' + ((i*53)%180) + 'deg;--gx:' +
         (28 + (i*29)%56) + '%;--gy:' + (12 + (i*17)%40) + '%">' +
      '<div class="bar"></div><div class="ti"></div><div class="tt"></div><div class="tg"></div>' +
      '<div class="no">' + String(i+1).padStart(2,'0') + '</div>' +
      '<div class="body">' +
        '<div class="cty">' + esc(c.name) + '</div>' +
        '<h3>' + esc(r.st.name) + '</h3>' +
        '<div class="meta">' + esc(r.day.d) + ' · ' + esc(r.st.t) + '</div>' +
        '<div class="eat">' + esc(r.st.eat) + '</div>' +
      '</div></div>';
  });
  $('grid').innerHTML = h;
  $('wCount').textContent = N;

  var fh = '<button data-f="ALL" class="on">ALL</button>';
  CITY_ORDER.forEach(function(code){
    fh += '<button data-f="' + code + '">' + esc(CITY[code].name) + '</button>';
  });
  $('wFilters').innerHTML = fh;
  Array.prototype.forEach.call($('wFilters').querySelectorAll('button'), function(b){
    b.onclick = function(){
      S.filter = b.dataset.f;
      Array.prototype.forEach.call($('wFilters').querySelectorAll('button'), function(x){
        x.classList.toggle('on', x === b);
      });
      var shown = 0;
      Array.prototype.forEach.call($('grid').children, function(t){
        var vis = (S.filter === 'ALL' || t.dataset.city === S.filter);
        t.style.display = vis ? '' : 'none';
        if(vis) shown++;
      });
      $('wCount').textContent = shown;
      if(S.filter !== 'ALL')
        document.documentElement.style.setProperty('--acc', CITY[S.filter].acc);
    };
  });

  Array.prototype.forEach.call($('grid').children, function(t){
    t.onclick = function(){ closeWall(); go(+t.dataset.i, {silent:true}); };
  });

  /* photographs load as tiles come into view */
  if('IntersectionObserver' in window){
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        var t = e.target; io.unobserve(t);
        photoFor(REEL[+t.dataset.i].st).then(function(u){
          if(!u) return;
          var pre = new Image();
          pre.onload = function(){
            t.querySelector('.ti').style.backgroundImage = 'url("' + u + '")';
            t.classList.remove('blank');
          };
          pre.src = u;
        });
      });
    }, {rootMargin:'400px'});
    Array.prototype.forEach.call($('grid').children, function(t){ io.observe(t); });
  }
}
function openWall(){
  buildWall();
  S.wallOn = true;
  play(false);
  $('wall').classList.add('on');
}
function closeWall(){
  S.wallOn = false;
  $('wall').classList.remove('on');
  document.documentElement.style.setProperty('--acc', accentFor(REEL[S.i].city));
}

/* ---------- wiring ---------- */
function start(fromIntro){
  $('intro').classList.add('gone');
  S.lastCity = null;
  go(0);
  play(true);
}
$('bStart').onclick = function(){ start(true); };
$('bAll').onclick   = function(){ $('intro').classList.add('gone'); S.lastCity = REEL[0].city; paint(0); openWall(); };
$('bPlay').onclick  = function(){ play(!S.playing); };
$('bNext').onclick  = function(){ play(false); go(S.i + 1, {silent:true}); };
$('bPrev').onclick  = function(){ play(false); go(S.i - 1, {silent:true}); };
$('bWall').onclick  = openWall;
$('wClose').onclick = closeWall;

document.addEventListener('keydown', function(e){
  if(!$('intro').classList.contains('gone')){
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); start(); }
    return;
  }
  if(e.code === 'Space'){ e.preventDefault(); play(!S.playing); }
  if(e.code === 'ArrowRight'){ play(false); go(S.i + 1, {silent:true}); }
  if(e.code === 'ArrowLeft'){ play(false); go(S.i - 1, {silent:true}); }
  if(e.code === 'KeyW'){ S.wallOn ? closeWall() : openWall(); }
  if(e.code === 'Escape'){ closeWall(); }
});

/* swipe on phones */
(function(){
  var x0 = null, y0 = null;
  $('cinema').addEventListener('touchstart', function(e){
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  $('cinema').addEventListener('touchend', function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){
      play(false);
      go(S.i + (dx < 0 ? 1 : -1), {silent:true});
    }
    x0 = null;
  }, {passive:true});
})();

buildRail();
document.documentElement.style.setProperty('--acc', CITY.NYC.acc);

})();
</script>
</body>
</html>
